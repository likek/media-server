    <title>媒体服务器</title>
  </head>
  <body data-page-node-id="6AY4FKCzcf3Ossg3tSz8eM">
    <div id="app" data-page-node-id="Hp5k3sLlxThPSvtmXaS1oi"></div>

    <script src="/workbox-window.prod.umd.js"></script>
    <script>
      if ('serviceWorker' in navigator && !localStorage.getItem('disable-sw')) {
        var wb = new workbox.Workbox('/sw.js');
        wb.addEventListener('activated', event => {
          if (!event.isUpdate) {
            console.log('sw首次激活!');
          } else {
            console.log('sw更新!');
          }
        });
        wb.addEventListener('waiting', event => {
          console.log('sw waiting状态');
        });
        wb.addEventListener('message', event => {
          if (event.data.type === 'CACHE_UPDATED') {
            var updatedURL = event.data.payload.updatedURL;
            console.log(`缓存更新: ${updatedURL}!`);
          }
        });
        wb.addEventListener('installed', event => {
          console.log('sw已安装, isUpdate:', event.isUpdate);
        });
        wb.register();
      }

      // PWA install prompt — 保存事件供后续使用
      window._deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window._deferredPrompt = e;
        console.log('PWA 可安装');
      });
      window.addEventListener('appinstalled', () => {
        window._deferredPrompt = null;
        console.log('PWA 已安装');
      });
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
